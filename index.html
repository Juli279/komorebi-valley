<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="juego indie" />
    <meta name="author" content="Julieta Mazzuco" />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Komorebi Valley</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
          <a class="navbar-brand" href="#">Komorebi Valley</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse text-center"
            id="navbarSupportedContent"
          >
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#"
                  >El Valle</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Vida Rural</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Estaciones</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Preguntas</a>
              </li>
            </ul>
            <button type="button" class="btn rounded-pill btn-demo">
              <i class="bi bi-controller"></i> Jugar Demo Beta
            </button>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <div class="px-4 py-5 my-5 text-center">
        <div class="container col-lg-6 mx-auto">
          <div class="border rounded-4 p-4">
            <h1 class="display-5 fw-bold text-body-emphasis">
              Quieres saber a cerca del Valle de Komorebi?
            </h1>
            <p class="lead mb-4">
              Súmate a nuestro playtest privado y ayúdanos a mejorar la
              experiencia de juego. Tu opinión es muy importante para nosotros.
            </p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
              <button type="button" class="btn btn-primary btn-lg px-4 gap-3">
                Inscribirme a la beta cerrada
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
    <script src="./js/bootstrap.min.js"></script>
  </body>
</html>
